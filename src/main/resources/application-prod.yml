spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/jzone-fast?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.jzone: info

jzone:
  security:
    captcha-enabled: true     # 是否启用滑块拼图验证码
    max-retry-count: 5        # 密码最大错误尝试次数
    lock-duration: 300        # 锁定时间（秒）

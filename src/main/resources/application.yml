spring:
  application:
    name: jzone-fast
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8086

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-read-cookie: false
  is-read-header: true

logging:
  level:
    com.jzone: debug

jzone:
  cache:
    provider: ${JZONE_CACHE_PROVIDER:caffeine}
  web:
    allowed-origins: ${JZONE_ALLOWED_ORIGINS:http://localhost:5173}
